<!DOCTYPE html>
<!--
  Hue Desk: a single-file color palette generator with contrast checks and exports.
  No build step, no dependencies. Open it, or host it free with GitHub Pages.
  Space = new palette. Click a hex to copy it. Lock colors you like and keep generating.
  MIT License, Copyright (c) 2026
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='20' height='100' fill='%23264653'/%3E%3Crect x='20' width='20' height='100' fill='%232A9D8F'/%3E%3Crect x='40' width='20' height='100' fill='%23E9C46A'/%3E%3Crect x='60' width='20' height='100' fill='%23F4A261'/%3E%3Crect x='80' width='20' height='100' fill='%23E76F51'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF6;--ink:#17171A;--mute:#6D6D78;--line:#17171A1F}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid #2B50FF;outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font:800 22px Syne,sans-serif;letter-spacing:-.03em;margin-right:auto}
.btn,select{padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:transparent;font-weight:500}
.btn:hover,select:hover{border-color:var(--ink)}.main{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700;padding:9px 22px}
.cols{flex:1;display:flex;min-height:0}
.col{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:22px;transition:background .35s,color .35s;min-width:0}
.top{display:flex;justify-content:space-between;gap:6px}
.chip{padding:6px 12px;border-radius:99px;border:1.5px solid currentColor;font-size:13px;font-weight:700;opacity:.85}.chip.on{background:currentColor}.chip.on span{color:var(--bg)}.chip:hover{opacity:1}
.hex{font:800 clamp(24px,3.4vw,44px)/1 Syne,sans-serif;letter-spacing:-.02em;text-align:left;text-transform:uppercase}
.meta{font-size:13px;margin-top:8px;opacity:.85}
@media(max-width:720px){.cols{flex-direction:column}.col{flex-direction:row;align-items:center;padding:10px 16px}.hex{font-size:22px}.meta{margin:0}}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
dialog{margin:auto;padding:26px;width:min(520px,92vw);border:1.5px solid var(--ink);border-radius:26px;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#0007}dialog h3{font:800 24px Syne,sans-serif;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs .btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea{width:100%;height:190px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:transparent;resize:none;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.saved{display:grid;gap:10px;max-height:340px;overflow:auto}.sv{display:flex;gap:8px;align-items:center}
.strip{flex:1;display:flex;height:44px;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer}.strip i{flex:1}
.empty{color:var(--mute)}.acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Hue Desk</div>
  <select id="harm" aria-label="Color harmony"><option value="analogous">Analogous</option><option value="complementary">Complementary</option><option value="triad">Triadic</option><option value="split">Split complementary</option><option value="mono">Monochrome</option><option value="random">Random</option></select>
  <button class="btn main" id="gen" title="Space">New palette</button>
  <button class="btn" id="save">Save</button><button class="btn" id="lib">Saved</button><button class="btn" id="exp">Export</button><button class="btn" id="link">Copy link</button>
</header>
<div class="cols" id="cols"></div>
<div id="toast" role="status"></div>
<dialog id="dx"><h3>Export</h3><div class="tabs" id="tabs"></div><textarea id="out" readonly></textarea><div class="acts"><button class="btn" id="cx">Close</button><button class="btn main" id="cp">Copy</button></div></dialog>
<dialog id="dl"><h3>Saved palettes</h3><div class="saved" id="sv"></div><div class="acts"><button class="btn" id="cl">Close</button></div></dialog>
<script>
const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n);
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
function hsl2hex(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return rgb2hex(f(0)*255,f(8)*255,f(4)*255)}
function hex2hsl(hx){let[r,g,b]=hex2rgb(hx).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
 if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[(h+360)%360,s*100,l*100]}
const lum=hx=>{const[r,g,b]=hex2rgb(hx).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const grade=r=>r>=7?"AAA":r>=4.5?"AA":r>=3?"AA large":"Fail";
const H={analogous:h=>[-40,-20,0,20,40].map(o=>h+o),complementary:h=>[h,h+10,h+180,h+190,h+170],triad:h=>[h,h+120,h+240,h+15,h+135],
 split:h=>[h,h+150,h+210,h+20,h+170],mono:h=>[h,h,h,h,h],random:()=>[0,0,0,0,0].map(()=>R(360))};
let cols=[1,2,3,4,5].map(()=>({hex:"#000000",lock:false})),saved=[];
try{saved=JSON.parse(localStorage.getItem("huedesk")||"[]")}catch(e){}
function gen(){const harm=$("#harm").value,lk=cols.find(c=>c.lock),h=lk?hex2hsl(lk.hex)[0]:R(360);
 const hues=H[harm](h),mono=harm==="mono",bs=35+R(45);let ls=[24,42,60,76,91];if(!mono)ls.sort(()=>Math.random()-.5);
 const fresh=hues.map((hh,i)=>hsl2hex(hh,Math.max(12,Math.min(95,bs+R(25)-10-(mono?i*4:0))),ls[i]+R(7)-3));
 cols.forEach((c,i)=>{if(!c.lock)c.hex=fresh[i]});render()}
function ink(hx){return ratio(hx,"#FFFFFF")>=ratio(hx,"#111111")?"#FFFFFF":"#111111"}
function render(){$("#cols").innerHTML=cols.map((c,i)=>{const k=ink(c.hex),r=ratio(c.hex,k);
 return`<div class="col" style="background:${c.hex};color:${k};--bg:${c.hex}"><div class="top"><button class="chip ${c.lock?"on":""}" data-a="lock" data-i="${i}" aria-pressed="${c.lock}"><span>${c.lock?"Locked":"Lock"}</span></button><label class="chip" style="cursor:pointer">Edit<input type="color" value="${c.hex}" data-i="${i}" hidden></label></div>
 <div><button class="hex" data-a="copy" data-i="${i}" title="Copy hex">${c.hex.slice(1)}</button><div class="meta">${k==="#FFFFFF"?"White":"Black"} text ${r.toFixed(1)}:1, ${grade(r)}</div></div></div>`}).join("");
 history.replaceState(null,"","#"+cols.map(c=>c.hex.slice(1)).join("-"))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1600)}
function copy(txt,msg){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg||"Copied "+txt)).catch(()=>{const a=$("#out");if(a.offsetParent)a.select();toast("Press Ctrl+C to copy")})}
$("#cols").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;if(b.dataset.a==="lock"){cols[i].lock=!cols[i].lock;render()}if(b.dataset.a==="copy")copy("#"+cols[i].hex.slice(1).toUpperCase())};
$("#cols").oninput=e=>{if(e.target.type==="color"){cols[+e.target.dataset.i].hex=e.target.value;cols[+e.target.dataset.i].lock=true;const c=e.target.closest(".col");c.style.background=e.target.value}};
$("#cols").onchange=e=>{if(e.target.type==="color")render()};
$("#gen").onclick=gen;$("#harm").onchange=gen;
document.onkeydown=e=>{if(e.code==="Space"&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)&&!document.querySelector("dialog[open]")){e.preventDefault();gen()}};
$("#save").onclick=()=>{const p=cols.map(c=>c.hex);if(!saved.some(s=>s.join()===p.join())){saved.unshift(p);saved=saved.slice(0,30);try{localStorage.setItem("huedesk",JSON.stringify(saved))}catch(e){}}toast("Palette saved")};
function drawSaved(){$("#sv").innerHTML=saved.length?saved.map((p,i)=>`<div class="sv"><div class="strip" data-load="${i}" title="Load palette">${p.map(h=>`<i style="background:${h}"></i>`).join("")}</div><button class="btn" data-del="${i}" aria-label="Delete palette">Delete</button></div>`).join(""):'<div class="empty">No saved palettes yet. Press Save to keep one you like.</div>'}
$("#lib").onclick=()=>{drawSaved();$("#dl").showModal()};$("#cl").onclick=()=>$("#dl").close();
$("#sv").onclick=e=>{const l=e.target.closest("[data-load]"),d=e.target.closest("[data-del]");
 if(l){cols=saved[+l.dataset.load].map(h=>({hex:h,lock:false}));render();$("#dl").close()}
 if(d){saved.splice(+d.dataset.del,1);try{localStorage.setItem("huedesk",JSON.stringify(saved))}catch(x){}drawSaved()}};
const FMT={"CSS":h=>":root {\n"+h.map((x,i)=>`  --color-${i+1}: ${x};`).join("\n")+"\n}","Tailwind":h=>"colors: {\n"+h.map((x,i)=>`  palette${i+1}: "${x}",`).join("\n")+"\n}","JSON":h=>JSON.stringify(h,null,2),"Hex list":h=>h.map(x=>x.toUpperCase()).join("\n")};
let fmt="CSS";function drawExp(){$("#tabs").innerHTML=Object.keys(FMT).map(k=>`<button class="btn ${k===fmt?"on":""}" data-f="${k}">${k}</button>`).join("");$("#out").value=FMT[fmt](cols.map(c=>c.hex))}
$("#exp").onclick=()=>{drawExp();$("#dx").showModal()};$("#tabs").onclick=e=>{if(e.target.dataset.f){fmt=e.target.dataset.f;drawExp()}};
$("#cx").onclick=()=>$("#dx").close();$("#cp").onclick=()=>copy($("#out").value,"Copied "+fmt);
$("#link").onclick=()=>copy(location.href,"Link copied");
const m=location.hash.slice(1).split("-");
if(m.length===5&&m.every(x=>/^[0-9a-f]{6}$/i.test(x)))cols=m.map(x=>({hex:"#"+x.toLowerCase(),lock:false}));else gen();
render();
</script>
</body>
</html>
